  </g>
  <g>
    <path d="M258 486 l40 -8 10 44 -42 8 Z" fill="#2f6fb8"/>
    <path d="M248 526 l62 -12 8 18 -64 12 Z" fill="#22518a"/>
    <path d="M256 486 l44 -8" stroke="#5b9ade" stroke-width="3" opacity="0.6"/>
  </g>

  <g stroke="#0d1519" stroke-width="3" fill="none" opacity="0.9">
    <path d="M60 560 q60 -18 120 4 t120 -2"/>
    <path d="M420 574 q70 -22 140 0"/>
  </g>

  <rect width="800" height="600" fill="url(#qn-vig)"/>
</svg>
